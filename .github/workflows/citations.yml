name: Check citations

on:
  schedule:
    # Mondays 06:17 UTC. Provider docs are single-page apps, so a removed page can
    # still answer 200; the scheduled job is what notices a claim losing its source.
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'scripts/check_citations.py'
      - '.github/workflows/citations.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'scripts/check_citations.py'
      - '.github/workflows/citations.yml'

permissions:
  contents: read

jobs:
  claim-table:
    name: Claim table is complete (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_citations.py --offline

  live-citations:
    name: Citations resolve and support their claims
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      # Exit code 2 means the network blocked the conclusion, not that the citations hold.
      - run: python scripts/check_citations.py
      - if: failure()
        run: echo "A scheduled citation failure is a report, not a build break: open an issue with the listed claims."
