name: Check citations

on:
  schedule:
    # Mondays 06:17 UTC. Provider docs are single-page apps, so a removed page can
    # still answer 200; the scheduled job is what notices a claim losing its source.
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'scripts/check_citations.py'
      - '.github/workflows/citations.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'scripts/check_citations.py'
      - '.github/workflows/citations.yml'

permissions:
  contents: read

jobs:
  claim-table:
    name: Claim table is complete (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_citations.py --offline

  live-citations:
    name: Citations resolve and support their claims
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      # Exit 1 means a citation rotted or stopped supporting its claim: that is red.
      # Exit 2 means the network prevented a conclusion: that is reported loudly as
      # unverified, never as a pass, but it is not rot and should not train anyone to
      # ignore a red citation run.
      - name: Check citations
        run: |
          set +e
          python scripts/check_citations.py > citations.log 2>&1
          code=$?
          set -e
          cat citations.log
          {
            echo "## Citation check"
            echo
            echo '```'
            cat citations.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Citations unverified::Some URLs could not be reached. They are UNVERIFIED, not passed. Re-run this workflow before drawing any conclusion."
            exit 0
          fi
          exit "$code"
