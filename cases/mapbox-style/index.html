<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江岸片区配送 · 矢量样式案例</title>
<link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css">
<style>
  :root { --ink: #22282c; --muted: #6b7480; --line: #dfe3e6; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: var(--ink); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .bar strong { font-size: 15px; }
  .bar .spacer { margin-left: auto; }
  button, select { font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
  button:focus-visible, select:focus-visible { outline: 3px solid #12669b; outline-offset: 2px; }
  #map { height: calc(100vh - 96px); }
  .status { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 16px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  .status output { color: var(--ink); font-variant-numeric: tabular-nums; }
  .zone-legend { position: absolute; z-index: 2; right: 12px; bottom: 36px; max-height: calc(100% - 100px); overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 11px; }
  .zone-legend li { display: flex; align-items: center; gap: 6px; list-style: none; }
  .zone-legend ul { margin: 0; padding: 0; }
  .zone-legend i { width: 12px; height: 12px; border-radius: 2px; }
  .ml-pop { font-size: 12px; }
  .ml-pop strong { display: block; font-size: 13px; }
  .ml-pop span { color: var(--muted); }
</style>
</head>
<body>
<header class="bar">
  <strong>江岸片区配送 · 矢量样式</strong>
  <span style="font-size:11px;color:var(--muted)">本地合成样式，无 token、无远程瓦片</span>
  <span class="spacer"></span>
  <label style="font-size:12px">主题
    <select data-testid="theme-select">
      <option value="day">日间（Quiet Analysis）</option>
      <option value="night">夜间（Night Operations）</option>
    </select>
  </label>
  <button type="button" data-testid="switch">切换样式</button>
  <button type="button" data-testid="switch-x8">连续切换 8 次</button>
</header>
<div id="map" data-testid="map" role="region" aria-label="江岸片区配送矢量地图"></div>
<div class="zone-legend" data-testid="legend" aria-label="图例"></div>
<footer class="status">
  <span>就绪 <output data-testid="ready" data-state="loading">载入中</output></span>
  <span>样式 <output data-testid="style-readout">—</output></span>
  <span>图层 <output data-testid="layer-readout">—</output></span>
  <span>来源 <output data-testid="source-readout">—</output></span>
  <span>style.load <output data-testid="load-readout">0</output></span>
  <span>选中 <output data-testid="selection-readout">无</output></span>
</footer>
<script type="module" src="/cases/mapbox-style/app.js"></script>
</body>
</html>
