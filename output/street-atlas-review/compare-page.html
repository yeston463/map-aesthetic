<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>街区配送 · 三方案对比</title>
  <style>
    :root { --paper: #f4f1e8; --ink: #222b27; --soft: #5d665f; --line: #dedcd0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    header { padding: 22px 24px 10px; }
    header h1 { margin: 0 0 6px; font: 600 19px/1.3 "Songti SC", serif; letter-spacing: .03em; }
    header p { margin: 0; color: var(--soft); font-size: 12.5px; }
    section { padding: 6px 24px 28px; }
    section + section { padding-top: 0; }
    h2 { margin: 0 0 8px; font: 600 13px/1.5 "Microsoft YaHei", sans-serif; color: var(--soft); }
    img { display: block; width: 100%; height: auto; border: 1px solid var(--line); background: #fff; }
    footer { margin: 0; padding: 0 24px 36px; color: var(--soft); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>街区配送 · 三方案对比</h1>
    <p>同一份数据、同一地图范围与缩放、同一交互状态（无弹窗、图层开启、面板收起）。三张面板分别为基准、方案一（满幅画板）、方案二（左右分栏）。请挑选更喜欢的方案并指出问题。</p>
  </header>
  <section>
    <h2>桌面 · 1440 × 900</h2>
    <img src="compare-desktop.png" alt="桌面端三方案对比图">
  </section>
  <section>
    <h2>手机 · 390 × 844</h2>
    <img src="compare-mobile.png" alt="手机端三方案对比图">
  </section>
  <footer>背景地物 © OpenStreetMap 贡献者。站点与线路均为虚构示例，不用于导航。</footer>
</body>
</html>
